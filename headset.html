<script>
// Each refresh starts at the beginning of the intro.
if('scrollRestoration' in history)history.scrollRestoration='manual';
scrollTo(0,0);
const intro=document.getElementById('intro');
const site=document.getElementById('site');
let enteringSite=false;
function skipIntro(){
 if(enteringSite)return;
 enteringSite=true;
 site.style.visibility='visible';
 document.body.classList.add('revealed');
 // The iframe is only a visual preview; the interactive site owns the top-level window.
 location.replace('./spatial.html#main');
}

if(matchMedia('(prefers-reduced-motion: reduce)').matches)skipIntro();
</script>
