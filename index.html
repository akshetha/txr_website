<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand control test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: white; color: #222; font: 16px/1.5 system-ui, sans-serif; }
    main { min-height: 260vh; padding: 150px 24px; text-align: center; }
    #box { display: block; width: 180px; height: 180px; margin: 32px auto; background: white; border: 2px solid #222; border-radius: 8px; font: inherit; cursor: pointer; }
    #box:hover, #box.target { background: #f0f0f0; }
    #box.clicked { background: #ddf5e5; }
    #controls { position: fixed; inset: 16px 16px auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; z-index: 10; }
    #controls button { font: inherit; background: white; border: 1px solid #aaa; border-radius: 5px; padding: 7px 12px; cursor: pointer; }
    #status { color: #666; font-size: 13px; }
    #preview { position: fixed; right: 16px; bottom: 16px; width: 160px; border-radius: 8px; transform: scaleX(-1); z-index: 10; }
    #cursor { position: fixed; left: 0; top: 0; width: 24px; height: 24px; margin: -12px; border: 2px solid #222; border-radius: 50%; background: #ffffff99; pointer-events: none; z-index: 20; display: none; }
    #cursor.pinched { background: #222; }
    #cursor.scrolling { border-radius: 5px; background: #76b9ff; }
  </style>
</head>
<body>
  <div id="controls">
    <button id="enable">Enable hand control</button>
    <button id="disable" hidden>Turn off camera</button>
    <span id="status" role="status">Optional camera control. Video stays on your device.</span>
  </div>
  <main>
    <p>Point to move · pinch and release to click · pinch and move up/down to scroll.</p>
    <button id="box">Click me · 0</button>
  </main>
  <video id="preview" autoplay muted playsinline hidden></video>
  <div id="cursor" aria-hidden="true"></div>
  <script type="module" src="./hand-control.js"></script>
</body>
</html>
